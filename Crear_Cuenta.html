<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>PixelVault Creacion de Cuenta</title>
</head>
<body>
    <header> 
        <h2>Creacion de Cuenta PixelVault</h2>
    </header>
    <main> 
        <div class="Contenedor_Crear_Cuenta"> 
            <a href="index.html">Inicio</a>
        </div>
        <form class="Formulario"> /*Contenedor especial para formularios o recopilacion de datos de un usuario*/

                <label for="nombre completo">Nombre Completo</label>
                <input type="text" id="nombre completo" placeholder="Ingrese su nombre completo">

                <label for="Apellido Paterno">Apellido Paterno</label>
                <input type="text" id="Apellido Paterno" placeholder="Ingrese su apellido paterno">

                <label for="Apellido Materno">Apellido Materno</label>
                <input type="text" id="Apellido Materno" placeholder="Ingrese su apellido materno">

                <label for="Correo Electronico">Correo Electronico</label>
                <input type="email" id="Correo Electronico" placeholder="Ingrese su correo electronico">

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña">

                <input type="submit" value="Crear Cuenta">
        </form>
        <video autoplay loop muted playsinline class="video-fondo">
            <source src="video_fondo.mp4" type="video/mp4">
        </video>
    </main>
